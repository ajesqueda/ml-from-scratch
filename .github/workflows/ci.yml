name: CI

on:
  pull_request:
  push:
    branches: [dev, qa, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        # Exit code 5 means "no tests collected", which is fine for a repo
        # that only has notes so far.
        run: pytest || [ $? -eq 5 ]
